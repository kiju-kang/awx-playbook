# =================================================================================
# 핸들러 즉시 실행 (Flush Handlers)
# =================================================================================
# 이 시점까지 notify된 모든 핸들러(reload sysctl, apt update 등)를 강제로 즉시 실행.
# 이는 후속 작업(예: kubeadm init)이 진행되기 전에 모든 변경 사항이 시스템에 적용 보장.
- name: Flush all handlers to apply changes before proceeding
  ansible.builtin.meta: flush_handlers
