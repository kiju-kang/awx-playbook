# IPVS 커널 모듈 목록
ipvs_modules:
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_lc
  - ip_vs_wlc
  - ip_vs_lblc
  - ip_vs_lblcr
  - ip_vs_sh
  - ip_vs_dh
  - ip_vs_sed
  - ip_vs_nq
  - nf_conntrack

# Tuned 프로파일 설정
profile_name: ktcloud-profile
parent_profile: throughput-performance

# Tuned 프로파일에 적용할 sysctl 값
tuned_sysctl:
  kernel.keys.root_maxbytes: 25000000
  kernel.keys.root_maxkeys: 1000000
  kernel.panic: 10
  kernel.panic_on_oops: 1
  vm.overcommit_memory: 1
  vm.panic_on_oom: 0
  net.ipv4.ip_local_reserved_ports: 30000-32767
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-arptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  fs.inotify.max_user_instances: 8192
  fs.inotify.max_user_watches: 1048576
  net.ipv4.conf.all.rp_filter: 0
  net.ipv4.conf.default.rp_filter: 0
  net.netfilter.nf_conntrack_max: 262144
  net.core.netdev_max_backlog: 4096
  net.core.somaxconn: 8192
  net.ipv4.tcp_rmem: "16384 349520 25165824"
  net.ipv4.tcp_wmem: "16384 349520 25165824"
  net.core.rmem_max: 25165824
  net.core.wmem_max: 25165824
  vm.dirty_background_ratio: 5
  vm.dirty_ratio: 10
  vm.swappiness: 5
  net.ipv4.igmp_max_memberships: 1024
  net.ipv4.neigh.default.gc_thresh1: 4096
  net.ipv4.neigh.default.gc_thresh2: 8192
  net.ipv4.neigh.default.gc_thresh3: 16384
  net.ipv4.route.gc_thresh: 16384
  net.ipv4.neigh.default.gc_interval: 60
  net.ipv4.neigh.default.gc_stale_time: 120
  net.ipv6.neigh.default.gc_thresh1: 4096
  net.ipv6.neigh.default.gc_thresh2: 8192
  net.ipv6.neigh.default.gc_thresh3: 16384
  net.ipv6.route.gc_thresh: 16384
  net.ipv6.neigh.default.gc_interval: 60
  net.ipv6.neigh.default.gc_stale_time: 120
  net.ipv6.conf.lo.disable_ipv6: 0
  fs.aio-max-nr: 131072
  vm.min_free_kbytes: 524288
  vm.vfs_cache_pressure: 10000
