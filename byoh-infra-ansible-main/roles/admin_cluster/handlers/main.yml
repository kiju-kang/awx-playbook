---
- name: apt update
  ansible.builtin.apt:
    update_cache: yes

- name: reload sysctl
  ansible.builtin.command: sysctl --system

- name: restart containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: restarted
    daemon_reload: true

- name: restart etcd
  ansible.builtin.systemd:
    name: etcd
    enabled: true
    state: restarted

- name: restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: restarted
    daemon_reload: true
