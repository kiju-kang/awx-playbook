# =================================================================================
# containerd 바이너리 다운로드 및 설치
# =================================================================================
# 작업에 필요한 최소한의 하드웨어 정보(특히 아키텍처)만 수집.
---
- name: Gather minimal hardware facts
  ansible.builtin.setup:
    gather_subset:
      - '!all'
      - hardware

# 수집된 아키텍처 정보(예: aarch64, x86_64)를 기반으로,
# 다운로드 URL에 사용할 아키텍처 이름('arm64' 또는 'amd64')을 'containerd_arch' 변수로 설정.
- name: Set containerd_arch fact
  ansible.builtin.set_fact:
    containerd_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64','arm64'] else 'amd64' }}"

# 위에서 설정한 아키텍처에 맞는 containerd 릴리스 압축 파일을 GitHub에서 다운로드.
# force: false - 파일이 이미 존재하면 다시 다운로드하지 않아 멱등성을 보장.
- name: Download containerd {{ containerd_version }}
  ansible.builtin.get_url:
    url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-{{ containerd_arch }}.tar.gz"
    dest: "/tmp/containerd-{{ containerd_version }}.tgz"
    mode: '0644'
    force: false

# 다운로드한 압축 파일에서 containerd 관련 바이너리들을 /usr/local/bin 디렉토리에 추출.
# extra_opts: ["--strip-components=1"] - 압축 해제 시 상위 디렉토리를 제거하고 내용물만 가져옴.
# creates: /usr/local/bin/containerd - 해당 파일이 이미 존재하면 작업을 건너뜀.
- name: Extract containerd to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/containerd-{{ containerd_version }}.tgz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: /usr/local/bin/containerd

# OCI 표준 컨테이너 런타임인 runc를 다운로드하여 /usr/local/sbin에 실행 가능하도록 저장.
- name: Download runc {{ runc_version }}
  ansible.builtin.get_url:
    url: "https://github.com/opencontainers/runc/releases/download/v{{ runc_version }}/runc.{{ containerd_arch }}"
    dest: /usr/local/sbin/runc
    mode: '0755'
    force: false

# CNI(Container Network Interface) 플러그인이 설치될 디렉토리를 생성.
- name: Ensure /opt/cni/bin exists
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    owner: root
    group: root
    mode: '0755'

# 컨테이너 네트워크를 구성하는 데 필요한 CNI 플러그인 모음을 다운로드.
- name: Download CNI plugins {{ cni_plugins_version }}
  ansible.builtin.get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-{{ containerd_arch }}-v{{ cni_plugins_version }}.tgz"
    dest: "/tmp/cni-plugins.tgz"
    mode: '0644'
    force: false

# 다운로드한 CNI 플러그인 압축 파일을 /opt/cni/bin 디렉토리에 해제.
# creates: /opt/cni/bin/bridge - 대표적인 플러그인 파일이 존재하면 작업을 건너뜀.
- name: Install CNI plugins to /opt/cni/bin
  ansible.builtin.unarchive:
    src: /tmp/cni-plugins.tgz
    dest: /opt/cni/bin
    remote_src: true
    extra_opts: ["--strip-components=1"]
    creates: /opt/cni/bin/bridge

# containerd 설정 파일(config.toml)이 위치할 디렉토리를 생성.
- name: Ensure /etc/containerd exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: '0755'

# containerd를 시스템 서비스로 관리하기 위한 systemd 유닛 파일을 템플릿을 통해 생성.
# notify: 파일 내용이 변경되면 'restart containerd' 핸들러를 호출하여 서비스를 재시작.
- name: Deploy containerd systemd unit
  ansible.builtin.template:
    src: containerd.service.j2
    dest: /usr/lib/systemd/system/containerd.service
  notify: restart containerd

# containerd의 기본 설정 파일(config.toml)을 템플릿을 통해 생성.
# SystemdCgroup = true 와 같은 중요한 설정들이 이 템플릿 안에 정의.
# notify: 파일 내용이 변경되면 'restart containerd' 핸들러를 호출.
- name: Deploy containerd config from template
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
  notify: restart containerd
