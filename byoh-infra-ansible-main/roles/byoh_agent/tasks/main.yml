# =================================================================================
# Kubernetes 클러스터 접속을 위한 admin.conf 파일 준비
# =================================================================================
# 작업 대상 노드에 admin.conf 파일을 저장할 디렉토리를 생성.
- name: Ensure target directory exists
  ansible.builtin.file:
    path: "{{ target_dir }}"
    state: directory
    mode: '0755'

# admin 클러스터의 마스터 노드에서 Ansible 컨트롤러로 admin.conf 파일을 가져옴.
# fetch 모듈은 원격지(마스터 노드)에서 컨트롤러로 파일을 복사.
# delegate_to: 이 작업을 마스터 노드에서 실행하도록 위임.
# run_once: 여러 노드에 대해 실행될 때 이 작업을 단 한 번만 실행.
- name: Fetch admin.conf from management node to controller
  fetch:
    src: "{{ local_admin_file }}"
    dest: "/tmp/byoh_adminconf_{{ admin_cluster_master_node_ip }}"
    flat: yes
  delegate_to: "{{ admin_cluster_master_node_ip }}"
  run_once: true

# Ansible 컨트롤러에 임시 저장된 admin.conf 파일을 최종 작업 대상 노드로 복사.
- name: Copy admin.conf from controller to BYOH node
  copy:
    src: "/tmp/byoh_adminconf_{{ admin_cluster_master_node_ip }}"
    dest: "{{ target_dir }}/{{ target_file }}"
    owner: root
    group: root
    mode: "0600"

# =================================================================================
# BYOH 에이전트가 사용할 Kubernetes 네임스페이스 관리
# =================================================================================
# admin 클러스터에 관리용 네임스페이스가 존재하는지 확인.
# delegate_to: kubectl 명령을 admin 클러스터의 마스터 노드에서 실행.
# failed_when: false: 명령이 실패(네임스페이스가 없음)해도 플레이북이 중단되지 않도록 함.
- name: Ensure management namespace exists
  ansible.builtin.command:
    cmd: kubectl get namespace "{{ mgmt_namespace }}"
  delegate_to: "{{ admin_cluster_master_node_ip }}"
  register: ns_check
  changed_when: false
  failed_when: false
  run_once: true

# 바로 앞 작업에서 네임스페이스가 존재하지 않았을 경우(rc != 0), 새로 생성.
- name: Create namespace if absent
  ansible.builtin.command:
    cmd: kubectl create namespace "{{ mgmt_namespace }}"
  delegate_to: "{{ admin_cluster_master_node_ip }}"
  when: ns_check.rc != 0
  run_once: true

# =================================================================================
# 노드 자체 설정
# =================================================================================
# 노드의 호스트 이름(예: pl-dev-jsh-master01)을 분석하여 역할 이름(예: master)을 추출.
# 호스트 이름을 '-'로 분리하고, 4번째 요소에서 숫자 부분을 제거하여 변수로 저장.
- name: Derive role_name from hostname
  ansible.builtin.set_fact:
    role_name: "{{ ansible_facts.hostname.split('-')[3] | regex_replace('[0-9]+$', '') }}"

# /etc/hosts 파일에 자신의 호스트 이름을 127.0.0.1로 추가.
- name: Add hostname to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ ansible_facts.hostname }}"
    state: present

# =================================================================================
# BYOH(Bring Your Own Host) 에이전트 설치 및 서비스 등록
# =================================================================================
# 지정된 URL에서 byoh-agent 바이너리 파일을 다운로드.
- name: Download BYOH agent binary
  ansible.builtin.get_url:
    url: "{{ byoh_agent_url }}"
    dest: "{{ byoh_agent_path }}"
    mode: '0755'
    owner: "{{ file_owner }}"
    group: "{{ file_group }}"

# byoh-agent를 관리할 systemd 서비스 유닛 파일을 템플릿을 사용하여 생성.
# 파일이 변경되면 systemd를 리로드하고 에이전트 서비스를 재시작하도록 notify 핸들러를 호출.
- name: Deploy byoh-agent unit file
  ansible.builtin.template:
    src: byoh-agent.service.j2
    dest: "{{ systemd_path }}/byoh-agent.service"
    mode: '0644'
  notify:
    - reload systemd
    - restart byoh-agent

# byoh-agent를 감시하거나 보조하는 watch 서비스 유닛 파일을 생성.
- name: Deploy watch unit file
  ansible.builtin.template:
    src: byoh-agent-watch.service.j2
    dest: "{{ systemd_path }}/byoh-agent-watch.service"
    mode: '0644'
  notify: reload systemd
